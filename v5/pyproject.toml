[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "high-table-holdings"
version = "5.3.0"
description = "Accounting and inventory management for Jaat Beaj Bhander"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "customtkinter>=5.2",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "docxtpl>=0.16",
    "pypdf>=4",
    "numpy>=1.24",  # the assistant's intent classifier (also needed by matplotlib)
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
pdf = ["docx2pdf>=0.1.8"]  # DOCX -> PDF through Microsoft Word (Windows / macOS)
assistant = ["llama-cpp-python>=0.3"]  # optional: runs the assistant's trained language model
voice = ["vosk>=0.3.45", "sounddevice>=0.4", "pywin32>=304; sys_platform == 'win32'"]  # optional: ask by voice

[project.scripts]
hth = "hth.__main__:main"

[tool.setuptools.packages.find]
include = ["hth*"]

[tool.setuptools.package-data]
"hth.modules.bills" = ["templates/*.docx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tools/assistant/kaggle_train_cell.py"]  # generated, with data.py embedded

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"hth/services/statements.py" = ["E501"]  # HTML template literal
"hth/i18n/hi.py" = ["E501"]  # phrase table: one English / Hindi pair per entry
"hth/i18n/hindi_words.py" = ["E501"]
"hth/assistant/{data,entities,normalize,system1}.py" = ["E501"]  # word lists and templates
"tools/assistant/kaggle_cell_template.py" = ["E402"]  # one notebook cell: settings first, then imports
